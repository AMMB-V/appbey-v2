services:
  appbey:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=appbey-super-secret-jwt-key-2026-beyblade-championship
      - DATABASE_URL=sqlite:///backend/data/appbey.db
    volumes:
      - appbey_data:/app/backend/data
    restart: unless-stopped

volumes:
  appbey_data:
