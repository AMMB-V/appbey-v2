# SonarQube & SonarCloud Configuration for AppBey
sonar.projectKey=appbey
sonar.projectName=AppBey
sonar.projectVersion=2.0.0

# Source folders to analyze
sonar.sources=server.ts,frontend
sonar.sourceEncoding=UTF-8

# Exclusions from analysis
sonar.exclusions=**/node_modules/**,**/dist/**,bun.lock,*.lock
sonar.coverage.exclusions=**/frontend/**,**/dist/**

# Environment definitions
sonar.javascript.environments=browser,node
