services:
  - type: web
    name: appbey-v2
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/app/main.py
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///backend/data/appbey.db
    disk:
      name: appbey-data
      mountPath: /app/backend/data
      sizeGB: 1
